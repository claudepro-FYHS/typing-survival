<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打字求生 Typing Survival</title>
<style>
  :root{
    --ink:#1f2a33; --panel:rgba(16,24,29,.86); --line:rgba(255,255,255,.16); --text:#f3f6f4; --muted:#a7b4b0;
    --me:#ffd23f; --hp:#5fdc74; --danger:#ff5a4d;
    --ui:"Trebuchet MS","Microsoft JhengHei","PingFang TC","Microsoft YaHei",sans-serif; --mono:Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#16201c;overflow:hidden;font-family:var(--ui);color:var(--text);user-select:none}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:#5c9f6a}
  #cv{position:absolute;inset:0;width:1280px;height:720px}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible{outline:3px solid var(--me);outline-offset:2px}

  /* HUD */
  #hud{position:absolute;inset:0;pointer-events:none;display:none}
  #hud.on{display:block}
  /* small and see-through on purpose: word labels pass underneath */
  .box{position:absolute;background:rgba(16,24,29,.6);border:1px solid rgba(255,255,255,.12);border-radius:8px}
  #hpbox{left:10px;top:8px;width:190px;padding:4px}
  #hp-bar{position:relative;height:18px;background:rgba(42,58,53,.8);border-radius:5px;overflow:hidden}
  #hp-fill{height:100%;background:var(--hp);border-radius:5px;transition:width .15s}
  #hp-fill.low{background:var(--danger)}
  #hp-num{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#0f1a14;letter-spacing:.5px}
  #wavebox{left:50%;top:8px;transform:translateX(-50%);padding:3px 14px 4px;text-align:center;white-space:nowrap}
  #hud-wave{font-size:15px;font-weight:800;letter-spacing:1px}
  #hud-left{font-size:11.5px;color:#cfd8d4;margin-left:10px}
  #scorebox{right:10px;top:8px;padding:2px 10px 3px;text-align:right;white-space:nowrap}
  #hud-score{font-family:var(--mono);font-size:19px;font-weight:700}
  #hud-kills{font-size:11.5px;color:#cfd8d4;margin-left:8px}
  #hud-combo{position:absolute;right:14px;top:42px;text-align:right;font-weight:800;font-style:italic;color:var(--me);font-size:26px;line-height:1;
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;transition:opacity .2s}
  #hud-combo small{display:block;font-size:11px;font-style:normal;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;margin-top:3px}
  #items{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:5px;padding:4px}
  .slot{width:38px;height:38px;border-radius:6px;background:rgba(24,35,42,.75);border:1.5px solid #4a5a63;position:relative;display:grid;place-items:center}
  .slot kbd{position:absolute;left:2px;top:1px;font-family:var(--mono);font-size:10px;font-weight:700;color:#cfd8d4}
  .slot .q{position:absolute;right:3px;bottom:0;font-family:var(--mono);font-weight:700;font-size:12px}
  .slot .lab{display:none}
  .slot i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
  .slot.empty{opacity:.35}
  .slot.active{border-color:var(--me);box-shadow:0 0 10px rgba(255,210,63,.7)}
  #statbox{right:10px;bottom:8px;padding:3px 10px;display:flex;gap:12px;font-size:11px;color:#cfd8d4;white-space:nowrap}
  #statbox b{font-family:var(--mono);font-size:15px;color:var(--text);margin-right:3px}
  #helpbox{left:10px;bottom:8px;padding:4px 10px;font-size:11px;color:#cfd8d4;white-space:nowrap}
  #helpbox kbd{font-family:var(--mono);color:#fff}
  #helpbox{animation:helpfade 1s 20s forwards}
  @keyframes helpfade{to{opacity:0}}
  #hint{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:var(--danger);color:#fff;font-weight:700;font-size:13px;padding:4px 12px;border-radius:14px;opacity:0;transition:opacity .2s}
  #hint.on{opacity:1}

  /* screens */
  .screen{position:absolute;inset:0;display:none;place-items:center;background:rgba(14,26,22,.78)}
  .screen.on{display:grid}
  #scr-menu{background:linear-gradient(rgba(14,26,22,.55),rgba(14,26,22,.9)),#5c9f6a}
  .card{width:640px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
  h1{font-size:44px;letter-spacing:4px;text-align:center}
  h1 small{display:block;font-size:14px;letter-spacing:6px;color:var(--me);font-weight:700;margin-top:2px}
  .row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:12px;margin-top:16px}
  .row label{font-size:13px;color:var(--muted);letter-spacing:2px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px 0;border-radius:8px;background:#22313a;border:2px solid transparent;font-weight:700;font-size:15px}
  .seg button:hover{background:#2c3f4a}
  .seg button.sel{background:var(--me);color:#241c00}
  .desc{grid-column:2;font-size:12.5px;color:var(--muted);margin-top:-8px;min-height:18px}
  .go{display:block;width:100%;margin-top:22px;padding:14px;border-radius:10px;background:var(--me);color:#241c00;font-size:20px;font-weight:800;letter-spacing:4px}
  .go:hover{filter:brightness(1.08)}
  .ghost{display:block;width:100%;margin-top:10px;padding:11px;border-radius:10px;background:#22313a;font-weight:700}
  #best{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
  .how{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.7}
  #res-score{font-family:var(--mono);font-size:60px;font-weight:700;text-align:center;color:var(--me);margin-top:6px}
  #res-sub{text-align:center;font-size:13px;color:var(--muted)}
  #res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  #res-grid div{background:#1c2931;border-radius:8px;padding:10px;text-align:center}
  #res-grid b{display:block;font-family:var(--mono);font-size:24px}
  #res-grid span{font-size:12px;color:var(--muted);letter-spacing:1px}
  #res-upload{text-align:center;font-size:13px;color:var(--muted);margin-top:14px;min-height:18px}
  #acct{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:14px;padding:6px 10px;background:#1c2931;border-radius:10px;font-size:13px}
  #acct .who{flex:1;font-weight:700;font-size:15px}
  #acct .tip{flex:1;color:var(--muted);font-size:12.5px}
  #acct button{padding:7px 12px;border-radius:8px;background:#2c3f4a;font-weight:700;font-size:13px}
  #acct #btn-fill{background:var(--me);color:#241c00}
  #row-grade.locked .seg{pointer-events:none}
  #row-grade.locked .seg button:not(.sel){display:none}
  .card input,.card select{width:100%;padding:10px 12px;border-radius:8px;border:2px solid #3a4d58;background:#16222a;color:var(--text);font:inherit;font-size:16px;user-select:text}
  .card input:focus,.card select:focus{outline:none;border-color:var(--me)}
  .preview{margin-top:16px;padding:10px 12px;background:#1c2931;border-radius:8px;font-size:14px}
  .preview b{font-family:var(--mono);font-size:20px;color:var(--me)}
  .preview span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .warn{font-size:12.5px;color:#ffb38a;margin-top:10px}
  #profile-err{min-height:18px;font-size:13px;color:#ffb38a;margin-top:10px;text-align:center}
  .card.wide{width:820px;padding:20px 26px}
  .lb-top{display:grid;grid-template-columns:1.5fr 1fr 1.1fr;gap:10px;margin-top:12px}
  .lb-top .seg button{font-size:13.5px;padding:8px 0}
  #lb-body{height:330px;overflow-y:auto;margin-top:12px;background:#16222a;border-radius:10px;padding:4px 6px}
  .lb-msg{padding:60px 0;text-align:center;color:var(--muted)}
  .lb-row{display:grid;grid-template-columns:44px 1fr 110px 84px 90px 56px;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:14px}
  .lb-row:nth-child(even){background:rgba(255,255,255,.035)}
  .lb-row i{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--muted);text-align:center}
  .lb-row:nth-child(-n+3) i{color:var(--me)}
  .lb-row b small{font-weight:400;color:var(--muted);margin-left:8px;font-family:var(--mono)}
  .lb-row span{text-align:right;color:var(--muted);font-size:13px}
  .lb-row .sc{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--text)}
  .lb-all .lb-row{grid-template-columns:44px 1fr 118px 110px 84px 90px 56px}
  .lb-row em{font-style:normal;font-size:12px;text-align:center;padding:2px 0;border-radius:10px;background:#263743;color:#cfd8d4}
  #lb-diff.off{visibility:hidden}
  .lb-row.me{background:rgba(255,210,63,.16);outline:1.5px solid var(--me)}
  #lb-pick{display:grid;grid-template-columns:60px 240px;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
  #lb-pick select{padding:7px 10px;font-size:15px}
  #lb-foot{font-size:12.5px;color:var(--muted);margin-top:10px;text-align:center;min-height:18px}
  #teambox{position:absolute;left:10px;top:40px;width:150px;display:none}
  #hud.multi #teambox{display:block}
  .mate{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:5px;background:rgba(16,24,29,.6);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:2px 7px 3px;margin-bottom:3px;font-size:11.5px}
  .mate i{width:8px;height:8px;border-radius:50%;border:2px solid var(--ink)}
  .mate b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mate span{font-family:var(--mono);color:#cfd8d4;font-size:11px}
  .mate .mb{grid-column:1/4;height:3px;background:#2a3a35;border-radius:2px;overflow:hidden}
  .mate .mb u{display:block;height:100%;background:var(--hp)}
  .mate.down{border-color:#ff8f8f}.mate.down span{color:#ff8f8f;font-family:var(--ui)}
  .mate.left{opacity:.45}
  #waiting{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;background:rgba(14,26,22,.6)}
  #pause-note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px}
  #res-team{margin-top:16px}
  .tr{display:grid;grid-template-columns:1fr 92px 56px 64px 48px;gap:8px;align-items:center;padding:7px 10px;border-radius:7px;font-size:14px}
  .tr span{text-align:right;color:var(--muted);font-family:var(--mono)}
  .tr.th span{font-family:var(--ui);font-size:12px}
  .tr b i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;border:2px solid var(--ink)}
  .tr .sc{color:var(--text);font-weight:700;font-size:16px}
  .tr:nth-child(even){background:rgba(255,255,255,.04)}
  .tr.me{outline:1.5px solid var(--me);background:rgba(255,210,63,.12)}
  .mp-or{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 0 4px}
  .mp-joinrow{display:grid;grid-template-columns:1fr 150px;gap:8px}
  .mp-joinrow .go{margin-top:0;font-size:16px;letter-spacing:2px;padding:10px}
  #mp-code-in{text-transform:uppercase;font-family:var(--mono);font-size:22px;letter-spacing:6px;text-align:center}
  #mp-codebox{text-align:center;margin-top:10px;font-size:13px;color:var(--muted)}
  #mp-code{display:block;font-family:var(--mono);font-size:54px;font-weight:700;letter-spacing:10px;color:var(--me);line-height:1.1;user-select:text}
  #mp-players{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
  .mp-p{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;background:#1c2931;border-radius:8px;padding:9px 12px;font-size:15px}
  .mp-p i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
  .mp-p span{font-size:12px;color:var(--muted)}
  .mp-p.empty{opacity:.4}.mp-p.empty b{font-weight:400;font-size:13px}
  #mp-msg{min-height:20px;text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
  #mp-msg.bad{color:#ffb38a}
  .go:disabled{opacity:.4;cursor:default;filter:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>

  <div id="hud">
    <div class="box" id="hpbox"><div id="hp-bar"><div id="hp-fill"></div><span id="hp-num">100</span></div></div>
    <div id="teambox"></div>
    <div id="waiting">等房主的畫面…</div>
    <div class="box" id="wavebox"><b id="hud-wave"></b><span id="hud-left"></span></div>
    <div class="box" id="scorebox"><b id="hud-score">0</b><span id="hud-kills"></span></div>
    <div id="hud-combo">x0<small id="hud-mult"></small></div>
    <div id="hint"></div>
    <div class="box" id="helpbox"><span id="hud-mode"></span> · <kbd>1</kbd>–<kbd>4</kbd> 道具 · <kbd>Esc</kbd> 選單</div>
    <div class="box" id="items">
      <div class="slot" id="slot-bomb"><kbd>1</kbd><i style="background:#ff8a3d"></i><span class="q">0</span><span class="lab">炸彈</span></div>
      <div class="slot" id="slot-freeze"><kbd>2</kbd><i style="background:#7fd8ff"></i><span class="q">0</span><span class="lab">冰凍</span></div>
      <div class="slot" id="slot-medkit"><kbd>3</kbd><i style="background:#ff6b81"></i><span class="q">0</span><span class="lab">醫療包</span></div>
      <div class="slot" id="slot-shield"><kbd>4</kbd><i style="background:#8be28b"></i><span class="q">0</span><span class="lab">護盾</span></div>
    </div>
    <div class="box" id="statbox"><span><b id="hud-wpm">0</b>WPM</span><span><b id="hud-acc">100%</b>準確</span></div>
  </div>

  <div class="screen" id="scr-menu">
    <div class="card">
      <h1>打字求生<small>TYPING SURVIVAL</small></h1>
      <div id="acct" style="display:none"></div>
      <div class="row"><label>模式</label><div class="seg" id="seg-mode"></div><div class="desc" id="mode-desc"></div></div>
      <div class="row"><label>難度</label><div class="seg" id="seg-diff"></div></div>
      <div class="row" id="row-grade"><label>年段</label><div class="seg" id="seg-grade"></div><div class="desc" id="bank-desc"></div></div>
      <button class="go" id="btn-start">開始</button>
      <button class="ghost" id="btn-multi">多人連線（2–6 人）</button>
      <button class="ghost" id="btn-board" style="display:none">排行榜</button>
      <div id="best"></div>
      <div class="how">喪屍頭上有英文單字，把字打出來就能擊倒它。打箱子上的字可以拿道具。</div>
    </div>
  </div>

  <div class="screen" id="scr-pause">
    <div class="card" style="width:380px">
      <h1 style="font-size:32px" id="pause-title">暫停</h1>
      <div id="pause-note"></div>
      <button class="go" id="btn-resume">繼續</button>
      <button class="ghost" id="btn-quit">回主畫面</button>
    </div>
  </div>

  <div class="screen" id="scr-result">
    <div class="card" style="width:580px">
      <h1 style="font-size:34px" id="res-title">遊戲結束</h1>
      <div id="res-score">0</div>
      <div id="res-sub"></div>
      <div id="res-grid"></div>
      <div id="res-team" style="display:none"></div>
      <div id="res-upload"></div>
      <button class="go" id="btn-again">再玩一次</button>
      <button class="ghost" id="btn-menu">回主畫面</button>
    </div>
  </div>

  <div class="screen" id="scr-profile">
    <div class="card" style="width:560px">
      <h1 style="font-size:30px" id="profile-title">資料</h1>
      <div id="profile-form"></div>
      <div id="profile-err"></div>
      <button class="go" id="btn-profile-save" style="margin-top:8px">儲存</button>
      <button class="ghost" id="btn-profile-later">先不填（成績不會上排行榜）</button>
    </div>
  </div>

  <div class="screen" id="scr-board">
    <div class="card wide">
      <h1 style="font-size:28px">排行榜</h1>
      <div class="lb-top"><div class="seg" id="lb-scope"></div><div class="seg" id="lb-mode"></div><div class="seg" id="lb-diff"></div></div>
      <div id="lb-pick" style="display:none"></div>
      <div id="lb-body"></div>
      <div id="lb-foot"></div>
      <button class="ghost" id="btn-board-back">回主畫面</button>
    </div>
  </div>
  <div class="screen" id="scr-room">
    <div class="card" style="width:600px">
      <h1 style="font-size:30px">多人連線</h1>
      <div id="mp-join">
        <div class="row"><label>名字</label><input id="mp-name" maxlength="12" placeholder="其他人看到的名字" autocomplete="off"></div>
        <button class="go" id="btn-mp-create">建立房間</button>
        <div class="mp-or">或者輸入同學給你的房號</div>
        <div class="mp-joinrow"><input id="mp-code-in" maxlength="5" placeholder="房號" autocomplete="off" spellcheck="false"><button class="go" id="btn-mp-join">加入房間</button></div>
        <button class="ghost" id="btn-mp-back">回主畫面</button>
      </div>
      <div id="mp-room" style="display:none">
        <div id="mp-codebox">房號<b id="mp-code"></b><span id="mp-settings"></span></div>
        <div id="mp-players"></div>
        <button class="go" id="btn-mp-start">開始</button>
        <button class="ghost" id="btn-mp-leave">離開房間</button>
      </div>
      <div id="mp-msg"></div>
    </div>
  </div>
</div>
<script src="config.js?v=0.3.3"></script>
<script src="words.js?v=0.3.3"></script>
<script src="lib/peerjs.min.js?v=0.3.3"></script>
<script src="js/engine.js?v=0.3.3"></script>
<script src="js/render.js?v=0.3.3"></script>
<script src="js/net.js?v=0.3.3"></script>
<script src="js/ui.js?v=0.3.3"></script>
<script src="js/room.js?v=0.3.3"></script>
<script src="js/account.js?v=0.3.3"></script>
</body>
</html>
